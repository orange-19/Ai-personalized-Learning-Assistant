# Application name
spring.application.name=backend-2

# PostgreSQL datasource for JPA
# Database name: backenddb
spring.datasource.url=jdbc:postgresql://localhost:5432/backenddb
spring.datasource.username=postgres
spring.datasource.password=orange@2005
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# src/main/resources/application.properties
python.api.generate-path.url=http://localhost:5000/api/generate-path

# Optional: tune HikariCP (uncomment/adjust as needed)
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.minimum-idle=2
spring.session.jdbc.initialize-schema=always

# JWT Configuration
# Per-user session secret architecture enabled:
# - Each user gets a unique cryptographically secure secret stored server-side
# - Secrets are stored in user_session_secrets table and tied to each user
# - Tokens are signed with user's secret and validated with that same secret
# - On logout, all user's secrets are revoked, instantly invalidating all tokens
# - No shared global secret - compromise of one user ? compromise of all users
jwt.use-dynamic-secret=false
jwt.secret=unused
jwt.expiration=86400000
jwt.refresh-expiration=604800000
