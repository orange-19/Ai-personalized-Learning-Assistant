# Application name
spring.application.name=backend-2

# PostgreSQL datasource for JPA
# Database name: backenddb
spring.datasource.url=jdbc:postgresql://localhost:5432/backenddb
spring.datasource.username=postgres
spring.datasource.password=orange@2005
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# src/main/resources/application.properties
python.api.generate-path.url=http://localhost:5000/api/generate-path

# Optional: tune HikariCP (uncomment/adjust as needed)
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.minimum-idle=2
spring.session.jdbc.initialize-schema=always

# JWT Configuration
# Set jwt.use-dynamic-secret=true to generate a new secret key on every application startup
# This uses SHA256 hashing with timestamp for high security
# For production with multiple instances, set to false and use a configured secret
jwt.use-dynamic-secret=true
jwt.secret=
jwt.expiration=86400000
